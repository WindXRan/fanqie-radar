[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fanqie-index-mcp"
version = "0.1.0"
description = "番茄小说榜单阅读 + 仿写选书评分 MCP 服务（stdio）。零爬虫依赖、零第三方运行时依赖。"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
fanqie-index = "fanqie_index.mcp_server:main"
fanqie-index-web = "fanqie_index.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
