<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>番茄雷达 Fanqie Radar · 番茄小说榜单扫榜选书工作台（MCP）</title>
  <meta name="description" content="番茄雷达 Fanqie Radar — 番茄小说榜单数据可视化看板与 MCP 服务：扫榜、题材热度、热词分析、仿写选书评分。零配置、内置示例数据、纯标准库零依赖。" />
  <meta property="og:title" content="番茄雷达 Fanqie Radar · 番茄小说榜单扫榜选书工作台" />
  <meta property="og:description" content="番茄小说榜单数据看板 + MCP：扫榜、题材热度、热词、仿写选书。零配置即用。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍅%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- 固定顶栏：品牌/切换 + 筛选工具条 + 快跳条，下滑不掉 -->
  <div class="topbar">
    <div class="wrap">
      <header class="top">
        <div class="brand">
          <div class="logo">📊</div>
          <div>
            <h1>番茄雷达</h1>
            <div class="sub">Fanqie Radar · 番茄小说榜单 · 扫榜选书工作台</div>
          </div>
        </div>
        <div class="controls">
          <span class="date-badge" id="dateBadge">数据日期 —</span>
          <div class="seg" id="segChannel">
            <button data-v="female" class="on">女频</button>
            <button data-v="male">男频</button>
          </div>
          <div class="seg" id="segRank">
            <button data-v="read" class="on">阅读榜</button>
            <button data-v="new">新书榜</button>
          </div>
          <button class="scrape-btn" id="scrapeBtn" title="采集番茄小说公开榜单数据">🔍 扫榜</button>
          <div class="drawer-btns">
            <button class="dbtn" data-p="heat" title="题材热度">📊</button>
            <button class="dbtn" data-p="trend" title="今日动静">⚡</button>
            <button class="dbtn" data-p="hot" title="书名热词">🔥</button>
            <button class="dbtn" data-p="cand" title="我的候选">★<span class="dn" id="candN" hidden></span></button>
          </div>
        </div>
      </header>

      <div class="toolbar">
        <input id="searchBox" class="search" type="text" placeholder="搜书名 / 作者 / 简介…" />
        <select id="catSel" class="sel"><option value="">全部品类</option></select>
        <div class="chips" id="chips">
          <button class="chip" data-f="status" data-v="done">完结</button>
          <button class="chip" data-f="status" data-v="serial">连载中</button>
          <button class="chip" data-f="min_reads" data-v="100000">≥10万在读</button>
          <button class="chip" data-f="min_reads" data-v="500000">≥50万在读</button>
        </div>
        <div class="seg" id="segSort" title="按在读=在读数从高到低；官方名次=番茄官方榜单排名（品类内名次）">
          <button data-v="reads" class="on">按在读</button>
          <button data-v="pos">官方名次</button>
        </div>
      </div>
      <div class="active-bar" id="activeBar" hidden></div>

      <div class="cat-nav" id="catNav" hidden></div>
    </div>
  </div>

  <!-- 主区：全宽书卡流 -->
  <div class="wrap">
    <div id="sections"><div class="skeleton">加载中…</div></div>
    <div class="ad-banner" id="adBox"></div>
    <div class="foot">
      本地扫榜 · 数据由本地快照提供 · 零第三方运行时依赖
    </div>
  </div>

  <!-- 侧栏抽屉（原侧栏四卡收编于此） -->
  <div class="drawer-mask" id="drawerMask" hidden></div>
  <aside class="drawer" id="drawer" hidden>
    <div class="d-head">
      <div class="d-tabs">
        <button data-p="heat" class="on">📊 热度</button>
        <button data-p="trend">⚡ 动静</button>
        <button data-p="hot">🔥 热词</button>
        <button data-p="cand">★ 候选</button>
      </div>
      <button id="dClose" aria-label="关闭">×</button>
    </div>
    <div class="d-body">
      <div class="d-panel" id="p-heat"><div id="heatList"><div class="skeleton">加载中…</div></div></div>
      <div class="d-panel" id="p-trend" hidden>
        <div class="trend-date" id="trendDate"></div>
        <div id="trendBox"><div class="skeleton">加载中…</div></div>
      </div>
      <div class="d-panel" id="p-hot" hidden><div class="cloud" id="hotwords"><div class="skeleton">加载中…</div></div></div>
      <div class="d-panel" id="p-cand" hidden><div id="candBox"><div class="empty">还没有收藏，翻到心动的点 ☆</div></div></div>
    </div>
    <div class="d-ad" id="adDrawer"></div>
  </aside>

  <!-- 扫榜面板 -->
  <div class="modal-mask" id="scrapeMask" hidden>
    <div class="modal scrape-modal">
      <button class="m-close" id="scrapeClose" aria-label="关闭">×</button>
      <h2>🔍 一键扫榜</h2>
      <p class="scrape-desc">从番茄小说公开榜单采集数据，自动保存到本地。首次运行自动安装依赖。</p>
      <div class="scrape-opts" id="scrapeOpts">
        <label>频道 <select id="scrapeGender"><option value="">全部</option><option value="female">女频</option><option value="male">男频</option></select></label>
        <label>榜单 <select id="scrapeRank"><option value="">全部</option><option value="read">阅读榜</option><option value="new">新书榜</option></select></label>
        <label>每分类上限 <input type="number" id="scrapeLimit" value="30" min="5" max="50" /></label>
        <label>间隔(秒) <input type="number" id="scrapeSleep" value="5" min="2" max="20" /></label>
      </div>
      <button class="scrape-big-btn" id="scrapeRun">🚀 开始采集</button>
      <div class="scrape-progress" id="scrapeProgress" hidden>
        <div class="scrape-progress-bar"><div class="scrape-progress-fill" id="scrapeProgressFill"></div></div>
        <div class="scrape-logs" id="scrapeLogs"></div>
      </div>
      <div class="scrape-note">
        数据来自番茄小说公开榜单页面，仅用于个人分析。采集完成后看板自动刷新。
      </div>
    </div>
  </div>

  <!-- 单本详情模态 -->
  <div class="modal-mask" id="modalMask" hidden>
    <div class="modal">
      <button class="m-close" id="mClose" aria-label="关闭">×</button>
      <div class="m-head">
        <div id="mCover"></div>
        <div class="m-headtxt">
          <h3 id="mTitle"></h3>
          <div class="m-meta" id="mMeta"></div>
        </div>
      </div>
      <div class="m-intro" id="mIntro"></div>
      <div class="m-foot" id="mFoot"></div>
    </div>
  </div>

  <!-- 回到顶部 -->
  <button id="toTop" title="回到顶部">↑</button>

  <script src="/static/app.js"></script>
</body>
</html>
